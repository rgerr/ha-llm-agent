ask:
  fields:
    prompt:
      required: true
      example: "Are any windows open while the heating is on? Answer yes or no first."
      selector:
        text:
          multiline: true
    provider:
      example: "Anthropic"
      selector:
        text:
    model:
      selector:
        text:
    conversation_id:
      selector:
        text:
    title:
      example: "Weekly battery check"
      selector:
        text:
    timeout:
      example: 900
      selector:
        number:
          min: 10
          max: 3600
          unit_of_measurement: s
          mode: box
